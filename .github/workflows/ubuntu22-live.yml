name: Ubuntu 22 Live Integration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recipe:
        description: Checked-in recipe under recipes/ to execute on the live gateway
        required: false
        default: recipes/ubuntu22-live.rx
        type: string

permissions:
  contents: read

# This workflow intentionally never runs for pull_request or feature-branch pushes.
# The self-hosted runner is the live Ubuntu 22 gateway, so only trusted pushes to
# main from the repository owner may execute here. A manual run may select only a
# tracked .rx file under recipes/; it cannot supply arbitrary shell commands or
# paths outside that tree. Manual dispatches exercise the same full integration
# path as a push, including refreshing the persistent Arthexis Watchtower after
# baseline checks. Only the newest live run matters; replace any stale
# queued/in-progress run so manual retries and fresh main pushes can reach the
# single gateway runner.
concurrency:
  group: ubuntu22-live-gateway
  cancel-in-progress: true

jobs:
  live:
    if: github.actor == 'arthexis'
    name: Live gateway recipe
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    env:
      GWAY_LOG_DESTINATION: https://logs.arthexis.com
      GWAY_LOG_READ_TOKEN: ${{ secrets.GWAY_LOG_READ_TOKEN }}
      GATEWAY_LOG_RUN_ID: gateway-${{ github.run_id }}-${{ github.run_attempt }}
      WATCHTOWER_LOG_RUN_ID: watchtower-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify trusted Ubuntu 22 gateway
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = "ubuntu"
          test "${VERSION_ID}" = "22.04"
          uname -a
          python3 --version
          sudo -n true

      - name: Select trusted RX recipe
        id: recipe
        shell: bash
        env:
          REQUESTED_RECIPE: ${{ github.event.inputs.recipe }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_RECIPE:-recipes/ubuntu22-live.rx}"
          validated="$(bash .github/scripts/validate-recipe-path.sh "${requested}")"
          printf 'path=%s\n' "${validated}" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap current GWAY
        shell: bash
        run: |
          set -euo pipefail
          sudo -n gway upgrade gway --force

      - name: Bootstrap live GWAY log service
        shell: bash
        run: |
          set -euo pipefail
          sudo -n gway upgrade web
          sudo -n gway upgrade wire
          sudo -n env GWAY_SERVICE=logs gway service install web --user root
          exposure="$(sudo -n gway --json wire server logs expose \
            --fqdn logs.arthexis.com \
            --dns-provider godaddy \
            --no-dns-rollback \
            --cert-email tecnologia@gelectriic.com)"
          printf '%s\n' "${exposure}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); sys.exit(0 if data.get("success") is True else 1)' "${exposure}"
          curl --fail --show-error --silent --max-time 5 http://127.0.0.1:8040/health
          echo

      - name: Prime local log consumers
        id: log_probe
        shell: bash
        run: |
          set -euo pipefail
          probe_run_id="log-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe="$(sudo -n env \
            GWAY_RUN_ID="${probe_run_id}" \
            gway --json log \
            --tags ci,ubuntu22,probe \
            --to "${GWAY_LOG_DESTINATION}" \
            --consumers wire,arthexis)"
          printf '%s\n' "${probe}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); consumers = set(data.get("consumers") or []); ok = bool(data.get("run_id")) and {"wire", "arthexis"} <= consumers; sys.exit(0 if ok else 1)' "${probe}"
          printf 'run_id=%s\n' "${probe_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify external log read credential
        if: env.GWAY_LOG_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 10 \
            --header "Authorization: Bearer ${GWAY_LOG_READ_TOKEN}" \
            "${GWAY_LOG_DESTINATION}/api/logs/${{ steps.log_probe.outputs.run_id }}/events" >/dev/null

      - name: Execute trusted RX recipe
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          result="$(sudo -n env \
            GWAY_RUN_ID="${GATEWAY_LOG_RUN_ID}" \
            gway --json recipe "${{ steps.recipe.outputs.path }}" \
            --fqdn register.arthexis.com \
            --cert-email tecnologia@gelectriic.com \
            --log_destination "${GWAY_LOG_DESTINATION}")"
          printf '%s\n' "${result}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); print("recipe success=%r" % (data.get("success"),), file=sys.stderr); sys.exit(0 if data.get("success") is True else 1)' "${result}"

      - name: Verify gateway recipe log publication
        if: always() && env.GWAY_LOG_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 10 \
            --header "Authorization: Bearer ${GWAY_LOG_READ_TOKEN}" \
            "${GWAY_LOG_DESTINATION}/api/logs/${GATEWAY_LOG_RUN_ID}/events" >/dev/null

      - name: Verify managed checkout revisions
        shell: bash
        run: |
          set -euo pipefail
          for checkout in /var/lib/gway/projects/arthexis/gway-wire /var/lib/gway/projects/arthexis/gway-web; do
            sudo -n git -C "${checkout}" rev-parse --is-inside-work-tree >/dev/null
            head="$(sudo -n git -C "${checkout}" rev-parse HEAD)"
            upstream="$(sudo -n git -C "${checkout}" ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
            printf '%s HEAD=%s origin/main=%s\n' "${checkout}" "${head}" "${upstream}"
            test -n "${upstream}"
            test "${head}" = "${upstream}"
            status="$(sudo -n git -C "${checkout}" status --porcelain)"
            if [[ -n "${status}" ]]; then
              printf 'managed checkout is dirty: %s\n%s\n' "${checkout}" "${status}" >&2
              exit 1
            fi
          done

      - name: Verify live public health
        shell: bash
        run: |
          set -euo pipefail
          readiness="$(sudo -n gway --json wire server check --fqdn register.arthexis.com)"
          printf '%s\n' "${readiness}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); ok = data.get("ok") is True and data.get("ready") is True; print("readiness ok=%r ready=%r" % (data.get("ok"), data.get("ready")), file=sys.stderr); sys.exit(0 if ok else 1)' "${readiness}"
          curl --fail --show-error --silent --max-time 10 https://register.arthexis.com/health
          echo

      # Diagnostic only: identify exactly which persistent Python/Django artifact
      # can still expose the removed generate_certs command before managed install.
      - name: Diagnose Arthexis command discovery
        shell: bash
        run: |
          set -u
          echo '=== generate_certs filesystem candidates ==='
          sudo -n find /opt/arthexis /var/lib/gway -xdev \
            \( -name 'generate_certs*' -o -path '*/apps/certs/*' \) \
            -printf '%y %p -> %l\n' 2>/dev/null | sort || true
          echo '=== Python cache candidates ==='
          sudo -n find /opt/arthexis /var/lib/gway -xdev \
            \( -name '*.pyc' -o -name '*.pyo' -o -name '__pycache__' \) \
            -path '*cert*' -printf '%y %p -> %l\n' 2>/dev/null | sort || true
          echo '=== Arthexis Python environments ==='
          for python in /opt/arthexis/venv/bin/python /opt/arthexis/.venv/bin/python /opt/arthexis/app/.venv/bin/python; do
            if sudo -n test -x "${python}"; then
              echo "--- ${python} ---"
              sudo -n "${python}" - <<'PY' || true
          import importlib.util
          import os
          import sys
          print('executable=', sys.executable)
          print('cwd=', os.getcwd())
          print('sys.path:')
          for item in sys.path:
              print(' ', item)
          for name in ('apps', 'apps.certs', 'apps.certs.models'):
              try:
                  spec = importlib.util.find_spec(name)
                  print(f'{name}: origin={getattr(spec, "origin", None)!r} locations={list(spec.submodule_search_locations or []) if spec else None!r}')
              except Exception as exc:
                  print(f'{name}: ERROR {type(exc).__name__}: {exc}')
          PY
            fi
          done
          echo '=== managed Arthexis checkout state ==='
          if sudo -n test -d /opt/arthexis/app/.git; then
            sudo -n git -C /opt/arthexis/app rev-parse HEAD || true
            sudo -n git -C /opt/arthexis/app status --porcelain --ignored || true
          fi

      - name: Bootstrap persistent Arthexis Watchtower
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          recipe="$(bash .github/scripts/validate-recipe-path.sh recipes/arthexis-bootstrap.rx)"
          result="$(sudo -n env \
            GWAY_RUN_ID="${WATCHTOWER_LOG_RUN_ID}" \
            gway --json recipe "${recipe}" \
            --role Watchtower \
            --log_destination "${GWAY_LOG_DESTINATION}")"
          printf '%s\n' "${result}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); print("arthexis bootstrap success=%r" % (data.get("success"),), file=sys.stderr); sys.exit(0 if data.get("success") is True else 1)' "${result}"

      - name: Verify Watchtower log publication
        if: always() && env.GWAY_LOG_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 10 \
            --header "Authorization: Bearer ${GWAY_LOG_READ_TOKEN}" \
            "${GWAY_LOG_DESTINATION}/api/logs/${WATCHTOWER_LOG_RUN_ID}/events" >/dev/null
