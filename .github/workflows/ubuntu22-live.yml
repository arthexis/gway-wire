name: Ubuntu 22 Live Integration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recipe:
        description: Checked-in recipe under recipes/ to execute on the live gateway
        required: false
        default: recipes/ubuntu22-live.rx
        type: string

permissions:
  contents: read

# This workflow intentionally never runs for pull_request. The self-hosted runner
# is the live Ubuntu 22 gateway, so only trusted main commits from the repository
# owner may execute here. A manual run may select only a tracked .rx file under
# recipes/; it cannot supply arbitrary shell commands or paths outside that tree.
# Only the newest live run matters; replace any stale queued/in-progress run so
# manual retries and fresh main pushes can reach the single gateway runner.
concurrency:
  group: ubuntu22-live-gateway
  cancel-in-progress: true

jobs:
  live:
    if: github.actor == 'arthexis'
    name: Live gateway recipe
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify trusted Ubuntu 22 gateway
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = "ubuntu"
          test "${VERSION_ID}" = "22.04"
          uname -a
          python3 --version
          sudo -n true

      - name: Select trusted RX recipe
        id: recipe
        shell: bash
        env:
          REQUESTED_RECIPE: ${{ github.event.inputs.recipe }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_RECIPE:-recipes/ubuntu22-live.rx}"
          validated="$(bash .github/scripts/validate-recipe-path.sh "${requested}")"
          printf 'path=%s\n' "${validated}" >> "${GITHUB_OUTPUT}"

      # Keep a minimal bootstrap outside the recipe so a gateway that still has a
      # pre-Chunk-9 GWAY can understand explicit recipe parameters. The recipe
      # deliberately upgrades GWAY again and executes `reload` to exercise the
      # real checkpoint/resume path under the current code.
      - name: Bootstrap current GWAY
        shell: bash
        run: |
          set -euo pipefail
          sudo -n gway upgrade gway --force

      - name: Execute trusted RX recipe
        shell: bash
        run: |
          set -euo pipefail
          result="$(sudo -n gway --json recipe "${{ steps.recipe.outputs.path }}" \
            --fqdn register.arthexis.com \
            --cert-email tecnologia@gelectriic.com)"
          printf '%s\n' "${result}"
          printf '%s\n' "${result}" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'

      # Raw host/network assertions stay in Actions rather than growing shell or
      # conditional semantics inside the .rx language.
      - name: Verify live public health
        shell: bash
        run: |
          set -euo pipefail
          sudo -n gway wire server check --fqdn register.arthexis.com
          curl \
            --fail \
            --show-error \
            --silent \
            --max-time 10 \
            https://register.arthexis.com/health
          echo
