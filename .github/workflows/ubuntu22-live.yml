name: Watchtower Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recipe:
        description: Checked-in recipe under recipes/ to execute on the live gateway
        required: false
        default: recipes/ubuntu22-live.rx
        type: string

permissions:
  contents: read

# This workflow intentionally never runs for pull_request or feature-branch pushes.
# The self-hosted runner is the trusted Watchtower gateway, so only trusted pushes
# to main from the repository owner may execute here. A manual run may select only
# a tracked .rx file under recipes/; it cannot supply arbitrary shell commands or
# paths outside that tree. Manual dispatches exercise the same full integration
# path as a push, including refreshing and exposing the persistent Arthexis
# Watchtower after baseline checks. Only the newest live run matters; replace any
# stale queued/in-progress run so manual retries and fresh main pushes can reach
# the single gateway runner.
concurrency:
  group: watchtower-deploy
  cancel-in-progress: true

jobs:
  live:
    if: github.actor == 'arthexis'
    name: Deploy Watchtower
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    env:
      GWAY_LOG_DESTINATION: https://logs.arthexis.com
      GWAY_LOG_READ_TOKEN: ${{ secrets.GWAY_LOG_READ_TOKEN }}
      GWAY_REPO_READ_TOKEN: ${{ secrets.GWAY_REPO_READ_TOKEN }}
      GATEWAY_LOG_RUN_ID: gateway-${{ github.run_id }}-${{ github.run_attempt }}
      WATCHTOWER_LOG_RUN_ID: watchtower-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify trusted Ubuntu 22 gateway
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = "ubuntu"
          test "${VERSION_ID}" = "22.04"
          uname -a
          python3 --version
          sudo -n true

      - name: Select trusted RX recipe
        id: recipe
        shell: bash
        env:
          REQUESTED_RECIPE: ${{ github.event.inputs.recipe }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_RECIPE:-recipes/ubuntu22-live.rx}"
          validated="$(bash .github/scripts/validate-recipe-path.sh "${requested}")"
          printf 'path=%s\n' "${validated}" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap current GWAY
        shell: bash
        run: |
          set -euo pipefail
          sudo -n gway upgrade gway --force

      - name: Bootstrap live GWAY log service
        shell: bash
        run: |
          set -euo pipefail
          sudo -n gway upgrade web --install
          sudo -n gway upgrade wire --install
          sudo -n env GWAY_SERVICE=logs gway service install web --user root
          exposure="$(sudo -n gway --json wire server logs expose \
            --fqdn logs.arthexis.com \
            --dns-provider godaddy \
            --no-dns-rollback \
            --cert-email tecnologia@gelectriic.com)"
          printf '%s\n' "${exposure}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); sys.exit(0 if data.get("success") is True else 1)' "${exposure}"
          curl --fail --show-error --silent --max-time 5 http://127.0.0.1:8040/health
          echo

      - name: Bootstrap authenticated Watchtower MCP endpoint
        shell: bash
        run: |
          set -euo pipefail

          # gway-web PR #39 introduces the MCP command/service. Keep the live
          # Watchtower deploy compatible with web/main until that PR lands; once
          # available, this same flow automatically provisions the endpoint.
          if ! sudo -n gway --json web mcp >/dev/null 2>&1; then
            echo 'gway-web MCP support is not on main yet; skipping MCP bootstrap'
            exit 0
          fi

          test -n "${GWAY_LOG_READ_TOKEN}"

          api_policy="$(sudo -n gway --json web api \
            --base-domain arthexis.com \
            --project web \
            --functions list-runs,get-run,get-events \
            --scope logs:read)"
          printf '%s\n' "${api_policy}"

          mcp_policy="$(sudo -n gway --json web mcp \
            --project web \
            --functions list-runs,get-run,get-events \
            --host mcp.arthexis.com)"
          printf '%s\n' "${mcp_policy}"

          token_metadata="$(sudo -n --preserve-env=GWAY_LOG_READ_TOKEN \
            gway --json web token \
            --name watchtower-mcp \
            --scope logs:read \
            --provision-env GWAY_LOG_READ_TOKEN)"
          printf '%s\n' "${token_metadata}"

          sudo -n env GWAY_SERVICE=mcp gway service install web --user root
          mcp_ready=false
          for attempt in {1..10}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8051/health >/dev/null; then
              mcp_ready=true
              break
            fi
            sleep 0.5
          done
          if [[ "${mcp_ready}" != "true" ]]; then
            sudo -n systemctl status gway-web-mcp.service --no-pager || true
            sudo -n journalctl -u gway-web-mcp.service -n 100 --no-pager || true
            exit 1
          fi

          exposure="$(sudo -n gway --json wire server public expose \
            --fqdn mcp.arthexis.com \
            --upstream http://127.0.0.1:8051 \
            --health-path /health \
            --dns-provider godaddy \
            --no-dns-rollback \
            --cert-email tecnologia@gelectriic.com)"
          printf '%s\n' "${exposure}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); sys.exit(0 if data.get("success") is True else 1)' "${exposure}"

          curl --fail --show-error --silent --max-time 10 \
            https://mcp.arthexis.com/health
          echo

          unauthenticated="$(
            curl --show-error --silent --output /dev/null \
              --write-out '%{http_code}' --max-time 10 \
              --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
              https://mcp.arthexis.com/mcp || true
          )"
          printf 'unauthenticated MCP status=%s\n' "${unauthenticated}"
          test "${unauthenticated}" != "200"

      - name: Bootstrap authenticated repository API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GWAY_REPO_READ_TOKEN}"
          sudo -n gway upgrade repo --install
          sudo -n gway upgrade web --install
          policy="$(sudo -n gway --json web api \
            --base-domain arthexis.com \
            --project repo \
            --functions context,impact,prs,map,files,symbols,code \
            --scope repo:read)"
          printf '%s\n' "${policy}"
          token_metadata="$(sudo -n --preserve-env=GWAY_REPO_READ_TOKEN \
            gway --json web token \
            --name repo-api \
            --scope repo:read \
            --provision-env GWAY_REPO_READ_TOKEN)"
          printf '%s\n' "${token_metadata}"
          sudo -n env GWAY_SERVICE=api gway service install web --user root
          api_ready=false
          for attempt in {1..10}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8050/health >/dev/null; then
              api_ready=true
              break
            fi
            sleep 0.5
          done
          if [[ "${api_ready}" != "true" ]]; then
            sudo -n systemctl status gway-web-api.service --no-pager || true
            sudo -n journalctl -u gway-web-api.service -n 100 --no-pager || true
            exit 1
          fi
          exposure="$(sudo -n gway --json wire server public expose \
            --fqdn repo.arthexis.com \
            --upstream http://127.0.0.1:8050 \
            --dns-provider godaddy \
            --no-dns-rollback \
            --cert-email tecnologia@gelectriic.com)"
          printf '%s\n' "${exposure}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); sys.exit(0 if data.get("success") is True else 1)' "${exposure}"

          unauthenticated="$(
            curl --show-error --silent --output /dev/null \
              --write-out '%{http_code}' --max-time 10 \
              'https://repo.arthexis.com/map?path=/var/lib/gway/projects/arthexis/gway-repo' || true
          )"
          printf '%s\n' '--- public unauthenticated response ---'
          printf 'status=%s\n' "${unauthenticated}"

          request_path='/map?path=/var/lib/gway/projects/arthexis/gway-repo&file_limit=5'
          public_headers="$(mktemp)"
          public_body="$(mktemp)"
          local_headers="$(mktemp)"
          local_body="$(mktemp)"
          trap 'rm -f "${public_headers}" "${public_body}" "${local_headers}" "${local_body}"' EXIT

          public_status="$(
            printf 'Authorization: Bearer %s\n' "${GWAY_REPO_READ_TOKEN}" |
              curl --show-error --silent --max-time 10 \
                --header @- \
                --dump-header "${public_headers}" \
                --output "${public_body}" \
                --write-out '%{http_code}' \
                "https://repo.arthexis.com${request_path}" || true
          )"
          printf '%s\n' '--- public authenticated response ---'
          printf 'status=%s\n' "${public_status}"
          cat "${public_headers}"
          printf '%s\n' 'body:'
          cat "${public_body}"
          printf '\n'

          local_status="$(
            printf 'Authorization: Bearer %s\n' "${GWAY_REPO_READ_TOKEN}" |
              curl --show-error --silent --max-time 10 \
                --header @- \
                --header 'Host: repo.arthexis.com' \
                --dump-header "${local_headers}" \
                --output "${local_body}" \
                --write-out '%{http_code}' \
                "http://127.0.0.1:8050${request_path}" || true
          )"
          printf '%s\n' '--- local authenticated response ---'
          printf 'status=%s\n' "${local_status}"
          cat "${local_headers}"
          printf '%s\n' 'body:'
          cat "${local_body}"
          printf '\n'

          test "${unauthenticated}" = "401"
          test "${public_status}" = "200"
          test "${local_status}" = "200"
          authenticated="$(cat "${public_body}")"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); sys.exit(0 if data.get("ok") is True else 1)' "${authenticated}"

      - name: Prime local log consumers
        id: log_probe
        shell: bash
        run: |
          set -euo pipefail
          probe_run_id="log-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe="$(sudo -n env \
            GWAY_RUN_ID="${probe_run_id}" \
            gway --json log \
            --tags ci,ubuntu22,probe \
            --to "${GWAY_LOG_DESTINATION}" \
            --consumers wire,arthexis)"
          printf '%s\n' "${probe}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); consumers = set(data.get("consumers") or []); ok = bool(data.get("run_id")) and {"wire", "arthexis"} <= consumers; sys.exit(0 if ok else 1)' "${probe}"
          printf 'run_id=%s\n' "${probe_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify external log read credential
        if: env.GWAY_LOG_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 10 \
            --header "Authorization: Bearer ${GWAY_LOG_READ_TOKEN}" \
            "${GWAY_LOG_DESTINATION}/api/logs/${{ steps.log_probe.outputs.run_id }}/events" >/dev/null

      - name: Execute trusted RX recipe
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          result="$(sudo -n env \
            GWAY_RUN_ID="${GATEWAY_LOG_RUN_ID}" \
            gway --json recipe "${{ steps.recipe.outputs.path }}" \
            --fqdn register.arthexis.com \
            --cert-email tecnologia@gelectriic.com \
            --log_destination "${GWAY_LOG_DESTINATION}")"
          printf '%s\n' "${result}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); print("recipe result=%r" % (data,), file=sys.stderr)' "${result}"

      - name: Verify gateway recipe log publication
        if: always() && env.GWAY_LOG_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 10 \
            --header "Authorization: Bearer ${GWAY_LOG_READ_TOKEN}" \
            "${GWAY_LOG_DESTINATION}/api/logs/${GATEWAY_LOG_RUN_ID}/events" >/dev/null

      - name: Verify managed checkout revisions
        shell: bash
        run: |
          set -euo pipefail
          for checkout in \
            /var/lib/gway/projects/arthexis/gway-wire \
            /var/lib/gway/projects/arthexis/gway-web \
            /var/lib/gway/projects/arthexis/gway-repo; do
            sudo -n git -C "${checkout}" rev-parse --is-inside-work-tree >/dev/null
            head="$(sudo -n git -C "${checkout}" rev-parse HEAD)"
            upstream="$(sudo -n git -C "${checkout}" ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
            printf '%s HEAD=%s origin/main=%s\n' "${checkout}" "${head}" "${upstream}"
            test -n "${upstream}"
            test "${head}" = "${upstream}"
            status="$(sudo -n git -C "${checkout}" status --porcelain)"
            if [[ -n "${status}" ]]; then
              printf 'managed checkout is dirty: %s\n%s\n' "${checkout}" "${status}" >&2
              exit 1
            fi
          done

      - name: Verify live public health
        shell: bash
        run: |
          set -euo pipefail
          readiness="$(sudo -n gway --json wire server check --fqdn register.arthexis.com)"
          printf '%s\n' "${readiness}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); ok = data.get("ok") is True and data.get("ready") is True; print("readiness ok=%r ready=%r" % (data.get("ok"), data.get("ready")), file=sys.stderr); sys.exit(0 if ok else 1)' "${readiness}"
          curl --fail --show-error --silent --max-time 10 https://register.arthexis.com/health
          echo

      - name: Bootstrap persistent Arthexis Watchtower
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          recipe="$(bash .github/scripts/validate-recipe-path.sh recipes/arthexis-bootstrap.rx)"
          result="$(sudo -n env \
            GWAY_RUN_ID="${WATCHTOWER_LOG_RUN_ID}" \
            gway --json recipe "${recipe}" \
            --log_destination "${GWAY_LOG_DESTINATION}")"
          printf '%s\n' "${result}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); print("arthexis bootstrap result=%r" % (data,), file=sys.stderr)' "${result}"

      - name: Expose and verify Arthexis public site
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          exposure="$(sudo -n gway --json wire server public expose \
            --fqdn arthexis.com \
            --upstream http://127.0.0.1:8888 \
            --health-path /health/ \
            --dns-provider godaddy \
            --no-dns-rollback \
            --cert-email tecnologia@gelectriic.com)"
          printf '%s\n' "${exposure}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); sys.exit(0 if data.get("success") is True else 1)' "${exposure}"

          site_url="$(sudo -n gway web site arthexis --url)"
          printf 'arthexis site=%s\n' "${site_url}"
          test "${site_url}" = "https://arthexis.com"

          public_check="$(sudo -n gway --json web check arthexis --public)"
          printf '%s\n' "${public_check}"
          python3 -c 'import json, sys; data = json.loads(sys.argv[1]); sys.exit(0 if data and all(item.get("ok") is True for item in data) else 1)' "${public_check}"

          sudo -n gway arthexis good
          curl --fail --show-error --silent --max-time 10 https://arthexis.com/health/
          echo

      - name: Verify Watchtower log publication
        if: always() && env.GWAY_LOG_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 10 \
            --header "Authorization: Bearer ${GWAY_LOG_READ_TOKEN}" \
            "${GWAY_LOG_DESTINATION}/api/logs/${WATCHTOWER_LOG_RUN_ID}/events" >/dev/null
